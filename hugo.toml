baseURL = 'https://nanpantanscouts.org.uk/'
languageCode = 'en-gb'
title = '1st Nanpantan Scouts'

# theme = "hugo-universal-theme" # This line is good

[module]
  [[module.imports]]
    path = 'github.com/devcows/hugo-universal-theme'

# not pluralize title pages by default
pluralizelisttitles = false

# Define the number of posts per page
[pagination]
    pagerSize = 10

# Main menu
[menu]
[[menu.main]]
    name       = "Home"
    identifier = "menu.home"
    url        = "/"
    weight     = 1

[[menu.main]]
    name       = "About"
    identifier = "menu.about"
    url        = ""
    weight     = 2

[[menu.main]]
    name       = "About Us"
    url        = "/about/"
    weight     = 1
    parent     = "menu.about"

[[menu.main]]
    name       = "Volunteer With Us"
    url        = "/volunteer/"
    weight     = 2
    parent     = "menu.about"

[[menu.main]]
    name       = "Admissions Policy"
    url        = "/admissions/"
    weight     = 3
    parent     = "menu.about"

[[menu.main]]
    name       = "FAQ"
    url        = "/faq/"
    weight     = 4
    parent     = "menu.about"

# No team page yet - restore this entry when there is one
# [[menu.main]]
#     name       = "Our Team"
#     url        = "/team/"
#     weight     = 5
#     parent     = "menu.about"

[[menu.main]]
    name       = "Sections"
    identifier = "menu.sections"
    weight     = 3

[[menu.main]]
    name       = "Squirrels"
    url        = "/squirrels/"
    weight     = 1
    parent     = "menu.sections"

[[menu.main]]
    name       = "Beavers"
    url        = "/beavers/"
    weight     = 2
    parent     = "menu.sections"

[[menu.main]]
    name       = "Cubs"
    url        = "/cubs/"
    weight     = 3
    parent     = "menu.sections"

[[menu.main]]
    name       = "Scouts"
    url        = "/scouts/"
    weight     = 4
    parent     = "menu.sections"

[[menu.main]]
    name       = "News"
    identifier = "menu.blog"
    url        = "/blog/"
    weight     = 5

[[menu.main]]
    name       = "Venue Hire"
    identifier = "menu.venue"
    url        = "/venue-hire/"
    weight     = 10

# Shown as a button (see .nav-cta in static/css/custom.css)
[[menu.main]]
    name       = "Join Us"
    identifier = "menu.join"
    url        = "/join/"
    weight     = 100
    params     = { class = "nav-cta" }

# Top bar social links menu

[[menu.topbar]]
    weight = 3
    name = "Facebook"
    url = "https://www.facebook.com/NanpantanScouts"
    pre = "<i class='fab fa-2x fa-facebook'></i>"

[[menu.topbar]]
    weight = 4
    name = "X"
    url = "https://x.com/NanpantanScouts"
    pre = "<i class='fab fa-2x fa-x-twitter'></i>"

[[menu.topbar]]
    weight = 5
    name = "Email"
    url = "mailto:info@nanpantanscouts.org.uk"
    pre = "<i class='fas fa-2x fa-envelope'></i>"

[params]
    viewMorePostLink = "/blog/"
    author = "1st Nanpantan"
    defaultKeywords = ["scouts", "Nanpantan", "Loughborough", "squirrels", "beavers", "cubs"]
    mainSections = ["blog"]
    defaultDescription = "Scouting for young people aged 4 to 14 in Nanpantan, Loughborough: Squirrels, Beavers, Cubs and Scouts."

    # Social media
    facebook_site = "NanpantanScouts" # the Facebook handle of your site ('https://www.facebook.com/HANDLE')
    # "Join the waiting list" buttons open a Facebook message to the group
    messenger_url = "https://m.me/NanpantanScouts"
    twitter_site = "NanpantanScouts" # the Twitter handle of your site (without the '@')
    default_sharing_image = "img/NanpantanLinearLogo.jpg"

    # Google Maps widget: If `googleMapsApiKey` is not set, no key will be passed to Google (which likely results in a broken map widget).
    # Off: no page shows a map, so this only loaded Google's script on every page
    enableGoogleMaps = false
    googleMapsApiKey = "AIzaSyAv7Sza8NSp9_l_g8G2vlo0H4ydEPn_2jY"

    latitude = "52.751598"
    longitude = "-1.24461"

    # Our Scouts-purple scheme (static/css/style.purple.css). The theme also has:
    # default (light-blue), blue, green, marsala, pink, red, turquoise, violet
    style = "purple"

    # Since this template is static, the contact form uses www.formspree.io as a
    # proxy. The form makes a POST request to their servers to send the actual
    # email. Visitors can send up to a 50 emails each month for free.
    #
    # What you need to do for the setup?
    #
    # - register your account to https://formspree.io/register
    # - login and create new form
    # - set your form's endpoint url under 'formspree_action' below
    # - upload the generated site to your server
    # - test a dummy email yourself
    # - you're done. Happy mailing!
    #
    # Enable the contact form by entering your Formspree.io endpoint url
    formspree_action = "https://formspree.io/sample/of/endpoint"
    contact_form_ajax = false

    # Formspree form supports Google reCAPTCHA Key (type v2).
    # If you use this feature, you should enable reCAPTCHA feature in the Formspree dashboard.
    #
    # By default, Formspree use a redirect page for recaptcha widget.
    # If you use a recaptcha widget in your contact page, you should do next steps.
    # (if you don't want, skip these steps)
    #
    #   1. register your site on Google recaptcha admin page: https://www.google.com/recaptcha/admin
    #   2. select reCAPTCHA v2 and checkbox widget type.
    #   3. remember site key and secret key.
    #   4. enter secret key into "Custom reCAPTCHA Key" field in your Formspree form setting page.
    #   5. change `enableRecaptchaInContactForm` is to true
    #   6. enter site key into `googleRecaptchaKey` to enable a recaptcha widget in your page.
    #
    enableRecaptchaInContactForm = false
    googleRecaptchaKey = "site_key_for_google_recaptcha"

    about_us = """<p>1st Nanpantan Scout Group gives young people aged 4 to 14 the chance to have adventures, make friends and learn skills for life.</p>
      <ul class="footer-links">
        <li><a href="/join/">Join us</a></li>
        <li><a href="/volunteer/">Volunteer with us</a></li>
        <li><a href="/venue-hire/">Hire our hut</a></li>
        <li><a href="/faq/">FAQ</a></li>
        <li><a href="/privacy/">Privacy</a></li>
      </ul>"""
    # {year} is replaced with the year the site was last built
    copyright = "Copyright (c) 2015 - {year}, 1st Nanpantan Scout Group; all rights reserved."

    # Format dates with Go's time formatting
    date_format = "2 January 2006"

    dropdown_mouse_over = false

    disabled_logo = false
    logo_text = "1st Nanpantan Scout Group"

    logo = "img/logo-header.png"
    logo_small = "img/logo-header.png"
    contact_url = "mailto:info@nanpantanscouts.org.uk"
    address = """<p class="text-uppercase"><strong>1st Nanpantan Scout Group</strong>
        <br>Nanpantan Road
        <br>Loughborough
        <br>LE11 3YE
        <br>England
        <br>
        <strong>Great Britain</strong>
      </p>
      """

[permalinks]
    blog = "/blog/:year/:month/:day/:contentbasename/"

# Enable or disable top bar with social icons
[params.topbar]
    enable = true
    text = """<p>Providing everyday adventure for young people in Loughborough</p><p class="hidden-sm hidden-xs">Contact us on info@nanpantanscouts.org.uk.</p>
      <p class="hidden-md hidden-lg">
      <a href="mailto:info@nanpantanscouts.org.uk" data-animate-hover="pulse"><i class="fas fa-envelope"></i></a>
      </p>
      """

# Enable and disable widgets for the right sidebar
[params.widgets]
    categories = true
    tags = true
    search = true

# Homepage banner
[params.hero]
    title = "Everyday adventure for young people in Nanpantan"
    text = "Squirrels, Beavers, Cubs and Scouts for ages 4 to 14, at our new Scout hut on Nanpantan Road, Loughborough."
    image = "img/photogrid.jpg"

[params.recent_posts]
    enable = true
    title = "Latest News"
    subtitle = "Recent Goings on at 1st Nanpantan Scout Group"
    hide_summary = false

[params.footer.recent_posts]
    enable = true

[taxonomies]
    category = "categories"
    tag = "tags"
    author = "authors"

[markup]
  [markup.goldmark]
    duplicateResourceFiles = false
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      linkifyProtocol = 'https'
      strikethrough = true
      table = true
      taskList = true
      [markup.goldmark.extensions.cjk]
        eastAsianLineBreaks = false
        eastAsianLineBreaksStyle = 'simple'
        enable = false
        escapedSpace = false
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.delete]
          enable = false
        [markup.goldmark.extensions.extras.insert]
          enable = false
        [markup.goldmark.extensions.extras.mark]
          enable = false
        [markup.goldmark.extensions.extras.subscript]
          enable = false
        [markup.goldmark.extensions.extras.superscript]
          enable = false
      [markup.goldmark.extensions.passthrough]
        enable = false
        [markup.goldmark.extensions.passthrough.delimiters]
          block = []
          inline = []
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '&ldquo;'
        leftSingleQuote = '&lsquo;'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '&rdquo;'
        rightSingleQuote = '&rsquo;'
    [markup.goldmark.parser]
      autoDefinitionTermID = false
      autoHeadingID = true
      autoIDType = 'github'
      wrapStandAloneImageWithinParagraph = true
      [markup.goldmark.parser.attribute]
        block = false
        title = true
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        enableDefault = false
        useEmbedded = 'auto'
      [markup.goldmark.renderHooks.link]
        enableDefault = false
        useEmbedded = 'auto'
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
    